<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termux Web UI</title>
    <!-- Memuat pustaka dari folder lokal static -->
    <link rel="stylesheet" href="/static/xterm.css" />
    <script src="/static/xterm.js"></script>
    <script src="/static/xterm-addon-fit.js"></script>
    <script src="/static/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000 !important;
            color: #f8f8f2;
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #terminal-container {
            flex: 1;
            width: 100%;
            padding: 4px;
            overflow: hidden;
        }
        #extra-keys {
            display: flex;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            height: 45px;
        }
        .key-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 1px solid #333;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .key-btn:active { background-color: #444; }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <div id="extra-keys">
        <button class="key-btn" onclick="sendKey('\x1b')">ESC</button>
        <button class="key-btn" onclick="sendKey('\t')">TAB</button>
        <button class="key-btn" onclick="sendKey('\x03')">CTRL+C</button>
        <button class="key-btn" onclick="sendKey('\x18')">CTRL+X</button>
        <button class="key-btn" onclick="sendKey('\x1b[A')">↑</button>
        <button class="key-btn" onclick="sendKey('\x1b[B')">↓</button>
    </div>

    <script>
        if (typeof Terminal === 'undefined' || typeof io === 'undefined') {
            document.body.innerHTML = '<div style="color:red; padding:20px; font-family:monospace;">File lokal di folder static/ gagal dimuat. Pastikan skrip ./setup.sh sudah dijalankan.</div>';
        } else {
            const socket = io();
            const term = new Terminal({
                cursorBlink: true,
                theme: { background: '#000000', foreground: '#f8f8f2' },
                fontFamily: 'monospace',
                fontSize: 14
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal-container'));
            fitAddon.fit();

            window.addEventListener('resize', () => fitAddon.fit());
            
            socket.on('connect', () => {
                term.focus();
            });

            term.onData(data => socket.emit('pty_input', data));
            socket.on('pty_output', data => term.write(data));

            function sendKey(sequence) {
                socket.emit('pty_input', sequence);
                term.focus();
            }
        }
    </script>
</body>
</html>
